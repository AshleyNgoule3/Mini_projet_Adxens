services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestion_employes}
      POSTGRES_USER: ${POSTGRES_USER:-gestion_employes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      # Publie sur un port decale pour ne pas heurter un PostgreSQL local.
      # A supprimer sur le VPS : la base n'a pas a etre joignable de l'exterieur.
      - "${DB_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gestion_employes} -d ${POSTGRES_DB:-gestion_employes}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gestion-employes-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gestion-employes-backend:local
    restart: unless-stopped
    environment:
      # Profil local : charge le jeu de donnees de demonstration.
      # Laisser vide pour reproduire le comportement d'un deploiement reel.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      # Nom de service et port interne : inchanges par le remappage ci-dessus.
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-gestion_employes}
      DB_USERNAME: ${POSTGRES_USER:-gestion_employes}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      # Inutilise dans le parcours nominal : le frontend passe par Nginx,
      # donc sur la meme origine. Conserve pour un appel direct hors proxy.
      APP_CORS_ORIGIN: ${APP_CORS_ORIGIN:-http://localhost:8090}
    ports:
      # Utile pour les verifications curl. Supprimable sans casser l'appli.
      - "${BACKEND_HOST_PORT:-18080}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gestion-employes-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: gestion-employes-frontend:local
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-8090}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gestion-employes-net

volumes:
  pgdata:

networks:
  gestion-employes-net:
    name: gestion-employes-net