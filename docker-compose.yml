services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestion_employes}
      POSTGRES_USER: ${POSTGRES_USER:-gestion_employes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gestion_employes} -d ${POSTGRES_DB:-gestion_employes}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gestion-employes-net

  backend:
    # Pas de Dockerfile applicatif a ce stade (hors perimetre) : image Maven
    # generique, code monte en volume, demarrage en mode dev.
    image: maven:3.9.9-eclipse-temurin-21
    restart: unless-stopped
    working_dir: /app
    command: ["./mvnw", "spring-boot:run"]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-gestion_employes}
      DB_USERNAME: ${POSTGRES_USER:-gestion_employes}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      APP_CORS_ORIGIN: ${APP_CORS_ORIGIN:-http://localhost:5173}
    volumes:
      - ./backend:/app
      - maven_repo:/root/.m2
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gestion-employes-net

  frontend:
    # Pas de Dockerfile applicatif a ce stade (hors perimetre) : image Node
    # generique, code monte en volume, serveur de dev Vite.
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    # --host 0.0.0.0 : le serveur de dev Vite n'ecoute que la boucle locale
    # par defaut, ce qui le rendrait injoignable depuis l'hote une fois dans
    # le conteneur.
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    environment:
      # Cible du proxy /api du serveur de dev (vite.config.ts) : le nom du
      # service backend sur le reseau Docker, jamais localhost depuis ce
      # conteneur. Jamais prefixe VITE_, donc jamais expose au bundle client.
      API_PROXY_TARGET: http://backend:8080
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - gestion-employes-net

volumes:
  pgdata:
  maven_repo:

networks:
  gestion-employes-net:
    name: gestion-employes-net
