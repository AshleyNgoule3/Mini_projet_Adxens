name: CI/CD

# Declencheurs :
#  - push sur main    : construction, tests, puis publication des images sur Docker Hub
#  - push sur develop : construction et tests seulement (pas de publication)
#  - pull request     : validation avant fusion (sert de controle de statut)
#  - manuel           : bouton "Run workflow" dans l'onglet Actions
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Le workflow ne fait que lire le depot : aucun droit d'ecriture necessaire.
permissions:
  contents: read

# Une seule execution par branche : une nouvelle poussee annule la precedente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Job 1 : backend Java / Spring Boot. Produit le JAR et joue les tests.
  # ---------------------------------------------------------------
  backend:
    name: Backend (compilation et tests)
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v4

      - name: Installation de Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilation et execution des tests
        working-directory: backend
        run: ./mvnw -B clean verify

      - name: Publication des rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-rapports-tests
          path: backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn

      - name: Publication de l'artefact JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # ---------------------------------------------------------------
  # Job 2 : frontend React / Vite. Produit le bundle statique dist/.
  # ---------------------------------------------------------------
  frontend:
    name: Frontend (compilation)
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v4

      - name: Installation de Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dependances
        working-directory: frontend
        run: npm ci

      - name: Construction du bundle de production
        working-directory: frontend
        run: npm run build

      - name: Publication de l'artefact dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ---------------------------------------------------------------
  # Job 3 : images Docker. Ne s'execute que sur un push dans main,
  # et seulement si les deux jobs precedents sont verts.
  # ---------------------------------------------------------------
  images:
    name: Images Docker (construction et publication)
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Expose le tag calcule ci-dessous au job "gitops", qui en a besoin
    # pour epingler la version dans le depot de deploiement.
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      # A adapter aux noms reels de tes depots Docker Hub.
      IMAGE_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/gestion-employes-backend
      IMAGE_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/gestion-employes-frontend
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v4

      - name: Calcul du tag immuable
        id: version
        run: echo "tag=$(date +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configuration de Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authentification sur Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Backend, construction et publication
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend, construction et publication
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_FRONTEND }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Recapitulatif
        run: |
          {
            echo "### Images publiees"
            echo ""
            echo "- \`${IMAGE_BACKEND}:${{ steps.version.outputs.tag }}\`"
            echo "- \`${IMAGE_FRONTEND}:${{ steps.version.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------
  # Job 4 : ferme la boucle GitOps.
  #
  # Argo CD ne surveille pas Docker Hub, il surveille le depot platform.
  # Republier une image ne declenche donc AUCUN deploiement : il faut
  # epingler le nouveau tag dans le depot de deploiement et commiter.
  # C'est ce commit qui fait foi sur ce qui tourne en production, et qui
  # permet un retour arriere par simple git revert.
  # ---------------------------------------------------------------
  gitops:
    name: Deploiement (mise a jour du depot platform)
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du depot de deploiement
        uses: actions/checkout@v4
        with:
          repository: AshleyNgoule3/platform
          # Deploy key du depot platform, AVEC acces en ecriture.
          # A ne pas confondre avec argocd_platform, qui reste en lecture seule.
          ssh-key: ${{ secrets.PLATFORM_DEPLOY_KEY }}
          ref: main

      - name: Epingler le nouveau tag des images
        env:
          TAG: ${{ needs.images.outputs.tag }}
        working-directory: gitops/manifests/gestion-employes/overlays/prod
        run: |
          # Les deux images partagent le meme tag : une substitution globale suffit.
          sed -i "s|newTag: .*|newTag: ${TAG}|g" kustomization.yaml
          echo "--- kustomization.yaml apres mise a jour ---"
          cat kustomization.yaml

      - name: Commiter et pousser
        env:
          TAG: ${{ needs.images.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Sortie sans erreur si le tag etait deja a jour (re-execution du
          # workflow sur le meme commit), sinon le job echouerait pour rien.
          if git diff --quiet; then
            echo "Tag deja a jour, rien a pousser."
            exit 0
          fi
          git commit -am "deploiement: gestion-employes ${TAG}"
          git push origin main

      - name: Recapitulatif
        env:
          TAG: ${{ needs.images.outputs.tag }}
        run: |
          {
            echo "### Deploiement demande"
            echo ""
            echo "Tag epingle dans le depot platform : \`${TAG}\`"
            echo ""
            echo "Argo CD applique l'ecart sous 3 minutes environ."
          } >> "$GITHUB_STEP_SUMMARY"
