spring:
  application:
    name: gestion-employes
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gestion_employes}
    username: ${DB_USERNAME:gestion_employes}
    password: ${DB_PASSWORD:gestion_employes}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # Explicite volontairement : le profil par defaut ne charge jamais les
    # donnees de demonstration de db/seed (voir application-local.yml).
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  cors:
    origin: ${APP_CORS_ORIGIN:http://localhost:5173}
  features:
    # Valeur retenue quand Unleash est injoignable ou desactive.
    # true en local pour travailler confortablement ; passee a false en
    # production, ou l'absence de reponse doit fermer l'acces plutot que
    # de reactiver silencieusement des actions desactivees.
    default-enabled: ${FEATURES_DEFAULT_ENABLED:true}

unleash:
  # Desactive par defaut : l'application demarre donc sans serveur Unleash,
  # ce qui est indispensable pour le developpement local et les tests.
  enabled: ${UNLEASH_ENABLED:false}
  # Attention au /unleash : le serveur est configure avec BASE_URI_PATH,
  # son API se trouve donc sous ce prefixe, y compris a l'interieur du cluster.
  api-url: ${UNLEASH_API_URL:http://unleash.unleash.svc.cluster.local:4242/unleash/api/}
  api-token: ${UNLEASH_API_TOKEN:}
  app-name: gestion-employes

