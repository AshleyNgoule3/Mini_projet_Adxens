server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Application monopage : toute route inconnue retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Meme role que le proxy du serveur de dev Vite : /api reste sur la meme
    # origine que la page, donc aucun CORS dans le parcours nominal.
    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Les fichiers generes par Vite portent un hash dans leur nom.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}